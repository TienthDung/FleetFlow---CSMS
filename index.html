<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FleetFlow - Hệ thống đặt xe tiện lợi, nhanh chóng, minh bạch.">
    <title>FleetFlow - Di Chuyển Tiện Lợi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="style/base.css">
    <link rel="stylesheet" href="style/pages/index.css">
    <link rel="icon" type="image/jpeg" href="assests/img/FleetFlow - Logo.png">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg custom-navbar sticky-top">
            <div class="container-base position-relative h-100">
                
                <a class="navbar-brand brand-overflow" href="#">
                    <img src="assests/img/logo1.jpg" alt="FleetFlow Logo" class="logo-img">
                </a>
                
                <button class="navbar-toggler border-0 ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#fleetflowNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="fleetflowNav">
                    <ul class="navbar-nav ms-auto align-items-center gap-4 mt-3 mt-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link text-white fw-medium dropdown-toggle" href="#" id="partnerDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Trở thành Đối tác của FleetFlow
                            </a>
                            <ul class="dropdown-menu shadow border-0" aria-labelledby="partnerDropdown">
                                <li><a class="dropdown-item py-2" href="#">Đăng kí trở thành tài xế FleetFlow</a></li>
                                <li><a class="dropdown-item py-2" href="#">Đăng kí trở thành kĩ thuật viên FleetFlow</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item py-2" href="#">Đăng kí cho thuê xe</a></li>
                            </ul>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link text-white fw-medium" href="#support">Trung tâm hỗ trợ</a>
                        </li>
                        <li class="nav-item ms-lg-2">
                            <button class="btn-login d-flex align-items-center gap-2" id="btnLogin">
                                <span>Đăng nhập</span>
                                <i class="fa-regular fa-user-circle fs-5"></i>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero-section position-relative overflow-hidden" style="background-image: url('assests/img/background_1.png');">
            <div class="container-base h-100 position-relative z-1">
                <div class="row align-items-center h-100">
                    
                    <div class="col-lg-6 text-white hero-content-left">
                        <h1 class="display-3 fw-bold mb-1 header-slogan">Tiện lợi</h1>
                        <h1 class="display-3 fw-bold mb-1 header-slogan">Nhanh chóng</h1>
                        <h1 class="display-3 fw-bold mb-4 header-slogan">An tâm</h1>
                        
                        <p class="lead text-white-80 mb-5 description-text">
                            Kết nối xe gần bạn nhanh chóng, giúp bạn đặt chuyến đi dễ dàng và an tâm theo dõi lộ trình.
                        </p>
                        
                        <button class="btn-base px-5 py-3 fs-5 shadow" id="btnBooking">
                            Đặt xe ngay
                        </button>
                    </div>

                </div>
            </div>

            <aside class="floating-contact-buttons d-flex flex-column gap-3">
                <a href="#" target="_blank" class="social-icon-btn zalo-bg" title="Chat Zalo">
                    <img src="assests/img/zalo.jpg" alt="Zalo" width="30" height="30">
                </a>
                <a href="#" target="_blank" class="social-icon-btn messenger-bg" title="Chat Messenger">
                    <img src="assests/img/messenger.jpg" alt="Messenger" width="30" height="30">
                </a>
                <a href="tel:1900xxxx" class="social-icon-btn phone-bg" title="Gọi hotline">
                    <img src="assests/img/calling.jpg" alt="Phone" width="30" height="30">
                </a>
            </aside>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assests/js/index.js"></script>
</body>
</html>
