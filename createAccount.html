<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow - Tạo tài khoản mới</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style/base.css">
    <link rel="stylesheet" href="style/pages/login.css">
</head>
<body>

    <main class="login-wrapper d-flex align-items-center" style="background-image: url('assests/img/login-background.png');">
        
        <div class="container">
            <div class="row align-items-start justify-content-center gap-lg-4">
                
                <div class="col-lg-5 text-white login-content-left mb-5 mb-lg-0 ps-lg-4">
                    <img src="assests/img/FleetFlow_-_Logo-removebg-preview.png" alt="FleetFlow Logo" class="login-logo mb-4">
                    
                    <h1 class="login-heading fw-bold mb-0">Tạo</h1>
                    <h2 class="login-subheading fw-normal mb-5">Tài khoản mới</h2>
                    
                    <div class="mt-3 text-white" style="font-size: 1.15rem; font-weight: 500;">
                        Bạn đã có tài khoản? 
                        <a href="login.html" class="forgot-pwd-link">Đăng nhập ngay</a>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="login-card shadow-lg">
                        <h3 class="login-card-title fw-bold">Tạo tài khoản<br>FleetFlow</h3>
                        
                        <form action="#" method="POST" class="mt-4">
                            
                            <div class="mb-3">
                                <label for="name" class="form-label custom-label text-uppercase">Name</label>
                                <input type="text" class="form-control custom-input" id="name" placeholder="Francois Mercer" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label custom-label text-uppercase">Email</label>
                                <input type="email" class="form-control custom-input" id="email" placeholder="hello@reallygreatsite.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label custom-label text-uppercase">Password</label>
                                <input type="password" class="form-control custom-input" id="password" placeholder="*************" required>
                            </div>

                            <div class="mb-4">
                                <label for="dob" class="form-label custom-label text-uppercase">Date of Birth</label>
                                <select class="form-select custom-input custom-select-arrow" id="dob" required>
                                    <option value="" disabled selected>Select</option>
                                    <option value="2005">2005</option>
                                    <option value="2006">2006</option>
                                    <option value="2007">2007</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-login-submit w-100">
                                Đăng kí
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assests/js/createAccount.js"></script>
</body>
</html>
